<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory & Manufacturing OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <header class="bg-slate-900 text-white p-4 flex flex-wrap gap-3 items-center justify-between">
    <div>
      <h1 class="text-xl font-bold">Inventory & Manufacturing OS</h1>
      <p class="text-xs text-slate-300">
        Orders, returns, inventory, forecast, and manufacturing plan
      </p>
    </div>
    <div class="flex items-center gap-3">
      <span id="last-updated" class="text-xs text-slate-300"></span>
      <button id="sync-button" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-2 rounded text-sm font-semibold">
        Sync now
      </button>
    </div>
  </header>

  <nav id="nav" class="p-4 flex flex-wrap gap-2"></nav>
  <main id="content" class="p-4"></main>

  <script>
    const api = '/.netlify/functions/api';

    const tabs = [
      ['dashboard', 'Dashboard'],
      ['packing', 'Packing Queue'],
      ['returns', 'Return Processing'],
      ['inventory', 'Inventory'],
      ['manufacturing', 'Manufacturing Plan'],
      ['sku', 'SKU Master'],
      ['exceptions', 'Exceptions'],
      ['sync', 'Sync Logs'],
      ['import', 'Import']
    ];

    let currentTab = 'dashboard';
    let timer = null;
    let mfgParams = { weeks: 4, method: '13W' };

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setContent(html) {
      document.getElementById('content').innerHTML = html;
    }

    function showError(err) {
      setContent(`
        <div class="bg-red-100 border border-red-300 text-red-800 p-4 rounded">
          <div class="font-bold">Error</div>
          <div>${esc(err.message || err)}</div>
        </div>
      `);
    }

    async function apiGet(resource, params = {}) {
      const qs = new URLSearchParams({ resource, ...params });
      const res = await fetch(`${api}?${qs.toString()}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed with status ${res.status}`);
      return data;
    }

    async function apiPost(action, body = {}) {
      const res = await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...body })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed with status ${res.status}`);
      return data;
    }

    function renderNav() {
      const html = tabs.map(([key, label]) => {
        const active = key === currentTab;
        return `
          <button
            data-tab="${key}"
            class="px-4 py-2 rounded ${active ? 'bg-slate-900 text-white' : 'bg-white text-slate-800 hover:bg-slate-200'}"
          >
            ${esc(label)}
          </button>
        `;
      }).join('');
      document.getElementById('nav').innerHTML = html;
    }

    function setTab(tab) {
      currentTab = tab;
      renderNav();
      loadData();

      if (timer) clearInterval(timer);
      const interval = tab === 'packing' ? 15000 : 60000;
      timer = setInterval(loadData, interval);
    }

    async function loadData() {
      try {
        document.getElementById('last-updated').textContent =
          `Updated ${new Date().toLocaleTimeString()}`;

        if (currentTab === 'dashboard') {
          const data = await apiGet('dashboard');
          renderDashboard(data);
        }

        if (currentTab === 'packing') {
          const data = await apiGet('packing-queue');
          renderPacking(data);
        }

        if (currentTab === 'returns') {
          const data = await apiGet('returns-pending');
          renderReturns(data);
        }

        if (currentTab === 'inventory') {
          const [inventory, skus] = await Promise.all([
            apiGet('inventory'),
            apiGet('sku-master')
          ]);
          renderInventory(inventory, skus);
        }

        if (currentTab === 'manufacturing') {
          const data = await apiGet('manufacturing-plan', mfgParams);
          renderManufacturing(data);
        }

        if (currentTab === 'sku') {
          const data = await apiGet('sku-master');
          renderSkuMaster(data);
        }

        if (currentTab === 'exceptions') {
          const data = await apiGet('exceptions');
          renderExceptions(data);
        }

        if (currentTab === 'sync') {
          const data = await apiGet('sync-logs');
          renderSyncLogs(data);
        }

        if (currentTab === 'import') {
          renderImport();
        }
      } catch (err) {
        showError(err);
      }
    }

    function card(label, value, sub = '') {
      return `
        <div class="bg-white rounded shadow p-4">
          <div class="text-sm text-slate-500">${esc(label)}</div>
          <div class="text-2xl font-bold">${esc(value ?? 0)}</div>
          ${sub ? `<div class="text-xs text-slate-400 mt-1">${esc(sub)}</div>` : ''}
        </div>
      `;
    }

    function table(rows, columns, emptyMessage = 'No records found') {
      if (!rows || !rows.length) {
        return `<div class="bg-white rounded shadow p-4 text-slate-500">${esc(emptyMessage)}</div>`;
      }

      const head = columns.map(col => `<th class="text-left p-3 border-b">${esc(col.label)}</th>`).join('');
      const body = rows.map(row => {
        const cells = columns.map(col => {
          const value = col.render ? col.render(row) : row[col.key];
          return `<td class="p-3 border-b align-top">${value}</td>`;
        }).join('');
        return `<tr>${cells}</tr>`;
      }).join('');

      return `
        <div class="overflow-auto bg-white rounded shadow">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-50">
              <tr>${head}</tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function normalizeSummary(input) {
      if (!input) return {};
      if (Array.isArray(input)) input = input[0];
      if (input && input.dashboard_summary) return input.dashboard_summary;
      return input;
    }

    function renderDashboard(data) {
      const s = normalizeSummary(data);

      setContent(`
        <div class="grid gap-3 md:grid-cols-3 xl:grid-cols-4">
          ${card('Gross Orders', s.gross_order_units, 'All imported order units')}
          ${card('Pre-Dispatch Cancellations', s.pre_dispatch_cancel_units, 'Cancelled before dispatch')}
          ${card('Net Demand', s.net_demand_units, 'Gross orders minus pre-dispatch cancellations')}
          ${card('Returns', s.return_units, 'All imported return units')}
          ${card('Return Rate', `${s.return_rate ?? 0}%`, 'Returns / gross orders')}
          ${card('Sellable Inventory', s.sellable_inventory, 'Available for sale')}
          ${card('Processing Inventory', s.processing_inventory, 'Press / dry cleaning / processing')}
          ${card('SPF Claim Inventory', s.spf_claim_inventory, 'Blocked under claim')}
          ${card('SKUs Short', s.shortage_skus, 'SKUs needing manufacture')}
          ${card('Pieces to Manufacture', s.total_manufacture_pieces, 'Total recommended production')}
        </div>

        <div class="mt-4 bg-blue-50 border border-blue-200 text-blue-900 p-4 rounded">
          <div class="font-semibold">How this works</div>
          <div class="mt-2 text-sm leading-6">
            Forecast Demand = Moving Average of Gross Orders minus Pre-Dispatch Cancellations.<br />
            Returns are analyzed separately and do not reduce the primary forecast demand.<br />
            Manufacturing Quantity = MAX(0, Forecast Required Inventory - Actual Usable Inventory).<br />
            Actual Usable Inventory = Sellable Inventory only. Processing and SPF claim stock are excluded.
          </div>
        </div>
      `);
    }

    function renderPacking(rows) {
      const columns = [
        { label: 'Platform', key: 'platform' },
        { label: 'Order Date', render: r => esc(new Date(r.order_date).toLocaleString()) },
        { label: 'Order ID', render: r => esc(r.order_id) },
        { label: 'SKU', render: r => esc(r.platform_sku_id) },
        { label: 'Master SKU', render: r => esc(r.master_sku_id || 'Unmapped') },
        { label: 'Product', render: r => esc(r.product_name || '-') },
        { label: 'Qty', key: 'quantity' },
        { label: 'Region', render: r => esc(r.region || '-') },
        { label: 'Dispatch Status', render: r => esc(r.dispatch_status || 'Pending') },
        {
          label: 'Action',
          render: r => {
            if ((r.dispatch_status || '').toLowerCase() === 'dispatched') {
              return `<span class="text-emerald-700 font-semibold">Dispatched</span>`;
            }
            return `
              <button
                data-action="dispatch"
                data-id="${r.id}"
                class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded"
              >
                Mark Dispatched
              </button>
            `;
          }
        }
      ];

      setContent(`
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-bold">Packing Queue</h2>
          <div class="text-sm text-slate-500">Refreshes every 15 seconds</div>
        </div>
        ${table(rows, columns, 'No pending orders found. Click Sync now if you expected orders.')}
      `);
    }

    function renderReturns(rows) {
      const columns = [
        { label: 'Platform', key: 'platform' },
        { label: 'Return Date', render: r => esc(new Date(r.return_date).toLocaleString()) },
        { label: 'Return ID', render: r => esc(r.return_id) },
        { label: 'Order ID', render: r => esc(r.order_id) },
        { label: 'SKU', render: r => esc(r.platform_sku_id) },
        { label: 'Master SKU', render: r => esc(r.master_sku_id || 'Unmapped') },
        { label: 'Qty', key: 'quantity' },
        { label: 'Region', render: r => esc(r.region || '-') },
        { label: 'Major Reason', render: r => esc(r.major_reason || '-') },
        { label: 'Minor Reason', render: r => esc(r.minor_reason || '-') },
        {
          label: 'Classify',
          render: r => `
            <div class="flex flex-wrap gap-2">
              <button data-action="classify" data-id="${r.id}" data-classification="sellable"
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded">
                Sellable
              </button>
              <button data-action="classify" data-id="${r.id}" data-classification="processing"
                class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded">
                Needs Press / Dry Cleaning
              </button>
              <button data-action="classify" data-id="${r.id}" data-classification="spf"
                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded">
                SPF Claim
              </button>
            </div>
          `
        }
      ];

      setContent(`
        <div class="mb-3">
          <h2 class="text-lg font-bold">Return Processing</h2>
          <p class="text-sm text-slate-500">
            Sellable increases sellable inventory. Processing keeps stock blocked until processed. SPF Claim blocks stock and creates a claim.
          </p>
        </div>
        ${table(rows, columns, 'No pending returns found.')}
      `);
    }

    function skuSelectOptions(skus) {
      return (skus || [])
        .map(s => `<option value="${esc(s.master_sku_id)}">${esc(s.master_sku_id)} - ${esc(s.product_name)}</option>`)
        .join('');
    }

    function renderInventory(inventory, skus) {
      const columns = [
        { label: 'Master SKU', key: 'master_sku_id' },
        { label: 'Product', render: r => esc(r.sku_master?.product_name || '-') },
        { label: 'Variant', render: r => esc(r.sku_master?.variant_attributes || '-') },
        { label: 'Sellable', key: 'sellable_stock' },
        { label: 'Processing', key: 'processing_stock' },
        { label: 'SPF Claim', key: 'spf_claim_stock' },
        { label: 'Total Physical', render: r => Number(r.sellable_stock || 0) + Number(r.processing_stock || 0) + Number(r.spf_claim_stock || 0) },
        { label: 'Updated', render: r => esc(r.updated_at ? new Date(r.updated_at).toLocaleString() : '-') }
      ];

      const options = skuSelectOptions(skus);

      setContent(`
        <div class="grid gap-4 xl:grid-cols-[2fr_1fr]">
          <div>
            <h2 class="text-lg font-bold mb-3">Inventory Balances</h2>
            ${table(inventory, columns, 'No inventory records found.')}
          </div>

          <div class="space-y-4">
            <form data-form="add-inventory" class="bg-white rounded shadow p-4 space-y-3">
              <h3 class="font-bold">Add / Adjust Sellable Inventory</h3>
              <select name="master_sku_id" required class="w-full border rounded p-2">
                <option value="">Select SKU</option>
                ${options}
              </select>
              <input name="quantity" type="number" required placeholder="Quantity, use negative to reduce" class="w-full border rounded p-2" />
              <input name="note" type="text" placeholder="Note / reason" class="w-full border rounded p-2" />
              <button class="bg-slate-900 text-white px-4 py-2 rounded w-full">Save Inventory</button>
            </form>

            <form data-form="process-to-sellable" class="bg-white rounded shadow p-4 space-y-3">
              <h3 class="font-bold">Mark Processed Items Sellable</h3>
              <p class="text-sm text-slate-500">
                Moves quantity from Processing to Sellable.
              </p>
              <select name="master_sku_id" required class="w-full border rounded p-2">
                <option value="">Select SKU</option>
                ${options}
              </select>
              <input name="quantity" type="number" min="1" required placeholder="Quantity" class="w-full border rounded p-2" />
              <button class="bg-emerald-600 text-white px-4 py-2 rounded w-full">Mark as Sellable</button>
            </form>

            <form data-form="add-manufacturing" class="bg-white rounded shadow p-4 space-y-3">
              <h3 class="font-bold">Add Manufactured Stock</h3>
              <p class="text-sm text-slate-500">
                Adds finished goods into sellable inventory.
              </p>
              <select name="master_sku_id" required class="w-full border rounded p-2">
                <option value="">Select SKU</option>
                ${options}
              </select>
              <input name="quantity" type="number" min="1" required placeholder="Quantity" class="w-full border rounded p-2" />
              <button class="bg-blue-600 text-white px-4 py-2 rounded w-full">Add Production Stock</button>
            </form>
          </div>
        </div>
      `);
    }

    function renderManufacturing(rows) {
      const columns = [
        { label: 'Master SKU', key: 'master_sku_id' },
        { label: 'Product', render: r => esc(r.product_name || '-') },
        { label: '3M SMA', render: r => esc(Number(r.sma_3m || 0).toFixed(2)) },
        { label: '13W SMA', render: r => esc(Number(r.sma_13w || 0).toFixed(2)) },
        { label: 'Forecast Required', render: r => esc(Number(r.forecast_required || 0).toFixed(2)) },
        { label: 'Usable Stock', key: 'actual_usable_stock' },
        { label: 'Gap', render: r => esc(Number(r.inventory_gap || 0).toFixed(2)) },
        {
          label: 'Verdict',
          render: r => {
            if (r.verdict === 'Manufacturing Required') {
              return `<span class="bg-red-100 text-red-700 px-2 py-1 rounded font-semibold">Manufacturing Required</span>`;
            }
            return `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded font-semibold">Inventory OK</span>`;
          }
        },
        { label: 'Pieces to Manufacture', key: 'pieces_to_manufacture' }
      ];

      setContent(`
        <div class="bg-white rounded shadow p-4 mb-4">
          <div class="grid gap-3 md:grid-cols-3 items-end">
            <div>
              <label class="text-sm text-slate-500 block mb-1">Planning Horizon</label>
              <select data-control="mfg-weeks" class="w-full border rounded p-2">
                ${[1, 2, 4, 8, 13].map(v => `
                  <option value="${v}" ${Number(mfgParams.weeks) === v ? 'selected' : ''}>
                    ${v} week${v > 1 ? 's' : ''}
                  </option>
                `).join('')}
              </select>
            </div>
            <div>
              <label class="text-sm text-slate-500 block mb-1">Forecast Method</label>
              <select data-control="mfg-method" class="w-full border rounded p-2">
                <option value="13W" ${mfgParams.method === '13W' ? 'selected' : ''}>13-week SMA</option>
                <option value="3M" ${mfgParams.method === '3M' ? 'selected' : ''}>3-month SMA</option>
              </select>
            </div>
            <div class="text-sm text-slate-500">
              Required Forecast Quantity = Weekly SMA × Planning Weeks.
              For 3-month SMA, monthly average is converted to weekly.
            </div>
          </div>
        </div>

        ${table(rows, columns, 'No manufacturing recommendations found.')}
      `);
    }

    function renderSkuMaster(rows) {
      const columns = [
        { label: 'Master SKU', key: 'master_sku_id' },
        { label: 'Product', key: 'product_name' },
        { label: 'Variant', render: r => esc(r.variant_attributes || '-') },
        { label: 'Status', key: 'status' },
        { label: 'Created', render: r => esc(new Date(r.created_at).toLocaleString()) }
      ];

      setContent(`
        <h2 class="text-lg font-bold mb-3">SKU Master</h2>
        ${table(rows, columns, 'No SKUs found.')}
      `);
    }

    function renderExceptions(data) {
      const negativeColumns = [
        { label: 'Master SKU', key: 'master_sku_id' },
        { label: 'Sellable', key: 'sellable_stock' },
        { label: 'Processing', key: 'processing_stock' },
        { label: 'SPF Claim', key: 'spf_claim_stock' }
      ];

      const unmappedColumns = [
        { label: 'Platform', key: 'platform' },
        { label: 'Platform SKU', key: 'platform_sku_id' },
        { label: 'Product', render: r => esc(r.product_name || '-') },
        { label: 'Seen Count', key: 'occurrences' },
        { label: 'Last Seen', render: r => esc(new Date(r.last_seen).toLocaleString()) },
        {
          label: 'Map',
          render: r => `
            <button
              data-action="map"
              data-platform="${esc(r.platform)}"
              data-platform-sku="${esc(r.platform_sku_id)}"
              class="bg-slate-900 text-white px-3 py-1 rounded"
            >
              Map SKU
            </button>
          `
        }
      ];

      setContent(`
        <div class="space-y-6">
          <div>
            <h2 class="text-lg font-bold mb-3">Unmapped SKUs</h2>
            ${table(data.unmapped_skus || [], unmappedColumns, 'No unmapped SKUs found.')}
          </div>

          <div>
            <h2 class="text-lg font-bold mb-3">Negative Inventory</h2>
            ${table(data.negative_inventory || [], negativeColumns, 'No negative inventory found.')}
          </div>
        </div>
      `);
    }

    function renderSyncLogs(rows) {
      const columns = [
        { label: 'Started', render: r => esc(new Date(r.started_at).toLocaleString()) },
        { label: 'Finished', render: r => esc(r.finished_at ? new Date(r.finished_at).toLocaleString() : '-') },
        { label: 'Platform', key: 'platform' },
        { label: 'Status', key: 'status' },
        { label: 'Records Imported', key: 'records_imported' },
        { label: 'Error', render: r => esc(r.error || '-') }
      ];

      setContent(`
        <div class="mb-3 bg-white rounded shadow p-4">
          <div class="font-bold">Automatic Sync</div>
          <div class="text-sm text-slate-500 mt-1">
            The sync function runs every 2 minutes. It reads Amazon/Flipkart JSON sources or the demo files in the data folder.
          </div>
        </div>
        ${table(rows, columns, 'No sync logs found.')}
      `);
    }

    function renderImport() {
      setContent(`
        <div class="grid gap-4 xl:grid-cols-2">
          <form data-form="import-orders" class="bg-white rounded shadow p-4 space-y-3">
            <h3 class="font-bold">Import Orders JSON</h3>
            <p class="text-sm text-slate-500">
              Paste an array of order objects. Required fields:
              platform, order_id, order_line_id, order_date, platform_sku_id, quantity.
            </p>
            <textarea name="orders_json" rows="12" class="w-full border rounded p-2 font-mono text-xs" placeholder='[{"platform":"Amazon","order_id":"123","order_line_id":"1","order_date":"2026-06-16T10:00:00Z","platform_sku_id":"AMZ-TSHIRT-BLK-M","quantity":1}]'></textarea>
            <button class="bg-slate-900 text-white px-4 py-2 rounded">Import Orders</button>
          </form>

          <form data-form="import-returns" class="bg-white rounded shadow p-4 space-y-3">
            <h3 class="font-bold">Import Returns JSON</h3>
            <p class="text-sm text-slate-500">
              Paste an array of return objects. Required fields:
              platform, return_id, order_id, return_date, platform_sku_id, quantity.
            </p>
            <textarea name="returns_json" rows="12" class="w-full border rounded p-2 font-mono text-xs" placeholder='[{"platform":"Amazon","return_id":"RET123","order_id":"123","return_date":"2026-06-16T10:00:00Z","platform_sku_id":"AMZ-TSHIRT-BLK-M","quantity":1,"major_reason":"Size","minor_reason":"Too small"}]'></textarea>
            <button class="bg-slate-900 text-white px-4 py-2 rounded">Import Returns</button>
          </form>
        </div>
      `);
    }

    async function syncNow() {
      const btn = document.getElementById('sync-button');
      btn.disabled = true;
      btn.textContent = 'Syncing...';

      try {
        const res = await fetch('/.netlify/functions/sync?manual=1');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sync failed');
        alert(`Sync completed.\nOrders imported: ${data.importedOrders || 0}\nReturns imported: ${data.importedReturns || 0}`);
        await loadData();
      } catch (err) {
        alert(err.message || 'Sync failed');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sync now';
      }
    }

    async function onClickAction(e) {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;

      const action = btn.dataset.action;

      try {
        if (action === 'dispatch') {
          await apiPost('mark-dispatched', { order_db_id: Number(btn.dataset.id) });
          await loadData();
        }

        if (action === 'classify') {
          await apiPost('classify-return', {
            return_db_id: Number(btn.dataset.id),
            classification: btn.dataset.classification
          });
          await loadData();
        }

        if (action === 'map') {
          const master = prompt('Enter Master SKU ID to map to:');
          if (!master) return;

          await apiPost('map-sku', {
            platform: btn.dataset.platform,
            platform_sku_id: btn.dataset.platformSku,
            master_sku_id: master.trim()
          });

          await loadData();
        }
      } catch (err) {
        alert(err.message || 'Action failed');
      }
    }

    async function onFormSubmit(e) {
      const form = e.target;
      if (!form.dataset.form) return;

      e.preventDefault();

      const fd = new FormData(form);

      try {
        if (form.dataset.form === 'add-inventory') {
          await apiPost('add-inventory', {
            master_sku_id: fd.get('master_sku_id'),
            quantity: Number(fd.get('quantity') || 0),
            note: fd.get('note') || ''
          });
          alert('Inventory saved.');
          await loadData();
        }

        if (form.dataset.form === 'process-to-sellable') {
          await apiPost('process-to-sellable', {
            master_sku_id: fd.get('master_sku_id'),
            quantity: Number(fd.get('quantity') || 0)
          });
          alert('Processing stock moved to sellable.');
          await loadData();
        }

        if (form.dataset.form === 'add-manufacturing') {
          await apiPost('add-manufacturing', {
            master_sku_id: fd.get('master_sku_id'),
            quantity: Number(fd.get('quantity') || 0)
          });
          alert('Manufactured stock added.');
          await loadData();
        }

        if (form.dataset.form === 'import-orders') {
          const parsed = JSON.parse(fd.get('orders_json') || '[]');
          const orders = Array.isArray(parsed) ? parsed : parsed.orders || [];
          const result = await apiPost('import-orders', { orders });
          alert(`Orders imported: ${result.imported || 0}`);
          await loadData();
        }

        if (form.dataset.form === 'import-returns') {
          const parsed = JSON.parse(fd.get('returns_json') || '[]');
          const returns = Array.isArray(parsed) ? parsed : parsed.returns || [];
          const result = await apiPost('import-returns', { returns });
          alert(`Returns imported: ${result.imported || 0}`);
          await loadData();
        }
      } catch (err) {
        alert(err.message || 'Save failed');
      }
    }

    function onContentChange(e) {
      const control = e.target.dataset?.control;
      if (!control) return;

      if (control === 'mfg-weeks') {
        mfgParams.weeks = Number(e.target.value);
        loadData();
      }

      if (control === 'mfg-method') {
        mfgParams.method = e.target.value;
        loadData();
      }
    }

    document.getElementById('nav').addEventListener('click', e => {
      const btn = e.target.closest('button[data-tab]');
      if (btn) setTab(btn.dataset.tab);
    });

    document.getElementById('content').addEventListener('click', onClickAction);
    document.getElementById('content').addEventListener('submit', onFormSubmit);
    document.getElementById('content').addEventListener('change', onContentChange);
    document.getElementById('sync-button').addEventListener('click', syncNow);

    renderNav();
    setTab('dashboard');
  </script>
</body>
</html>
