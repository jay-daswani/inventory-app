# Inventory app: settings Netlify reads when it builds the site.

[build]
  command = "npm install"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Wakes up every 30 minutes, checks for new and changed orders, and hands the work to sync-background.
[functions."sync-scheduled"]
  schedule = "*/30 * * * *"
