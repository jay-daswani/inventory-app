<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Daswani Exports Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1F3F8;
    --panel: #FFFFFF;
    --ink: #1B2250;
    --text: #262B3D;
    --muted: #5E6579;
    --line: #D8DDE8;
    --line-soft: #E8EBF2;
    --accent: #2B3990;
    --accent-fg: #FFFFFF;
    --accent-soft: #E4E8F8;
    --danger: #A3163F;

    --delivered: #4E9A65;  --delivered-bg: #E2F1E7;  --delivered-fg: #1D4D2D;
    --transit:   #D19A12;  --transit-bg:   #FAF0CC;  --transit-fg:   #654A00;
    --pack:      #3F86D0;  --pack-bg:      #E0EDFA;  --pack-fg:      #174A82;
    --returned:  #7A2145;  --returned-bg:  #F4E0E8;  --returned-fg:  #5A1432;
    --cancelled: #8D94A6;  --cancelled-bg: #ECEEF3;  --cancelled-fg: #475064;
    --rto:       #C2185B;  --rto-bg:       #FADFEA;  --rto-fg:       #860E3E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12152A; --panel: #1A1E38; --ink: #E9ECFB; --text: #D7DBEC; --muted: #9AA1BA;
      --line: #2E3452; --line-soft: #252A47; --accent: #8EA0FF; --accent-fg: #101436; --accent-soft: #272D58; --danger: #FF8FA8;
      --delivered: #5DB77A; --delivered-bg: #1F3A2A; --delivered-fg: #A8E3BB;
      --transit: #E2B238;   --transit-bg: #3F3513;   --transit-fg: #F3D77F;
      --pack: #5AA0E8;      --pack-bg: #1B3350;      --pack-fg: #A8D0F7;
      --returned: #C2527F;  --returned-bg: #43202F;  --returned-fg: #F2B3CB;
      --cancelled: #7C8397; --cancelled-bg: #262B44;  --cancelled-fg: #B5BBCD;
      --rto: #E0507F;       --rto-bg: #471F31;       --rto-fg: #F7B0C7;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--text);
    font: 15px/1.5 "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3 { color: var(--ink); margin: 0; line-height: 1.2; font-weight: 600; }
  h1 { font-size: 26px; }
  h2 { font-size: 18px; }
  h3 { font-size: 15px; }
  p { margin: 0; }
  a { color: var(--accent); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--muted); }
  .num { text-align: right; white-space: nowrap; }

  /* ---------- header ---------- */
  .top { background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1180px; margin: 0 auto; padding: 14px 16px 0; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand-name { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .brand-name span { font-weight: 400; color: var(--muted); margin-left: 8px; }
  .brand-right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .fresh { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); text-decoration: none; }
  .fresh::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--delivered); }
  .fresh.stale::before { background: var(--transit); }
  .fresh.busy::before { background: var(--pack); }
  nav.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs a {
    padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 500;
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head p { margin-top: 4px; color: var(--muted); max-width: 62ch; }

  /* ---------- controls ---------- */
  .controls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .field input, .field select {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); min-width: 0; font-size: 14px;
  }
  .field input[type="search"] { min-width: 220px; }
  .btn {
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
    font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: not-allowed; filter: none; }
  .btn.quiet { background: transparent; color: var(--accent); }
  .btn.small { padding: 4px 10px; font-size: 13px; }

  /* ---------- the order journey (overview) ---------- */
  .lede { font-size: 21px; line-height: 1.45; font-weight: 450; color: var(--ink); max-width: 46em; }
  .lede strong { font-weight: 700; }
  .journey { display: flex; gap: 3px; height: 30px; margin: 22px 0 12px; }
  .journey > span { display: block; min-width: 3px; border-radius: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; }
  .legend li { list-style: none; display: flex; align-items: center; gap: 7px; }
  .legend { margin: 0; padding: 0; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .stage-delivered { --c: var(--delivered); --bg: var(--delivered-bg); --fg: var(--delivered-fg); }
  .stage-in_transit { --c: var(--transit); --bg: var(--transit-bg); --fg: var(--transit-fg); }
  .stage-to_dispatch { --c: var(--pack); --bg: var(--pack-bg); --fg: var(--pack-fg); }
  .stage-returned { --c: var(--returned); --bg: var(--returned-bg); --fg: var(--returned-fg); }
  .stage-cancelled { --c: var(--cancelled); --bg: var(--cancelled-bg); --fg: var(--cancelled-fg); }
  .stage-rto { --c: var(--rto); --bg: var(--rto-bg); --fg: var(--rto-fg); }
  .stage-other { --c: var(--cancelled); --bg: var(--cancelled-bg); --fg: var(--cancelled-fg); }
  .journey > span, .swatch { background: var(--c); }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--bg); color: var(--fg); white-space: nowrap; }

  .block { margin-top: 38px; }
  .block > h2 { margin-bottom: 4px; }
  .block > .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; max-width: 70ch; }
  .two { display: grid; grid-template-columns: 1fr 1.25fr; gap: 40px; }
  .two > * { min-width: 0; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; gap: 0; } }

  .chart-legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-scroll { overflow-x: auto; }
  svg.chart { width: 100%; min-width: 680px; height: auto; display: block; overflow: visible; }
  svg.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  svg.chart .grid { stroke: var(--line-soft); stroke-width: 1; }
  svg.chart .bar-orders { fill: var(--ink); }
  svg.chart .bar-returns { fill: var(--returned); }
  svg.chart .hit { fill: transparent; }
  svg.chart .hit:hover { fill: color-mix(in srgb, var(--accent) 10%, transparent); }

  .reasons { list-style: none; margin: 0; padding: 0; }
  .reasons li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .reasons .what { font-weight: 500; }
  .reasons .sub { color: var(--muted); font-size: 13px; }
  .reasons .count { font-weight: 600; color: var(--ink); text-align: right; }
  .reasons .track { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .reasons .track i { display: block; height: 100%; background: var(--returned); border-radius: 3px; }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line-soft); }
  th { font-weight: 600; color: var(--muted); font-size: 13px; background: color-mix(in srgb, var(--paper) 55%, var(--panel)); position: sticky; top: 0; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }
  td.num, th.num { text-align: right; }
  table.items td:first-child { min-width: 170px; }
  td .sub { display: block; color: var(--muted); font-size: 12.5px; }
  /* On a phone, Orders and Returns rows become small cards instead of a table you have to scroll sideways. */
  @media (max-width: 700px) {
    .tablewrap:has(table.stack) { overflow: visible; background: transparent; border: 0; }
    table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: auto; }
    table.stack thead { display: none; }
    table.stack tr { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
    table.stack td { border: 0; padding: 3px 0; text-align: left; display: grid; grid-template-columns: 104px 1fr; gap: 8px; }
    table.stack td::before { content: attr(data-l); color: var(--muted); font-size: 12.5px; padding-top: 1px; }
    table.stack td.num { text-align: left; }
    table.stack td:not([data-l]) { display: block; font-weight: 600; color: var(--ink); padding-bottom: 4px; }
    table.stack td:not([data-l])::before { content: none; }
    table.stack td:empty { display: none; }
    table.stack tbody tr:hover td { background: transparent; }
    .inner { overflow: visible; padding: 8px 8px 0; }
    .inner table.stack tr { background: var(--paper); }
  }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .pager .btns { display: flex; gap: 8px; }

  .cond { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 13.5px; }
  .cond[data-v="sellable"] { background: var(--delivered-bg); color: var(--delivered-fg); border-color: transparent; }
  .cond[data-v="damaged"] { background: var(--rto-bg); color: var(--rto-fg); border-color: transparent; }
  .cond[data-v="dry_clean"], .cond[data-v="press"] { background: var(--transit-bg); color: var(--transit-fg); border-color: transparent; }

  /* ---------- catalogue ---------- */
  details.design { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
  details.design > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; }
  details.design > summary::-webkit-details-marker { display: none; }
  details.design > summary::before { content: "▸"; color: var(--muted); width: 1em; transition: transform .12s; }
  details.design[open] > summary::before { transform: rotate(90deg); }
  .design-name { font-weight: 600; color: var(--ink); font-size: 16px; }
  .design-facts { color: var(--muted); font-size: 13.5px; }
  .design-bulk { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .design-bulk input { width: 84px; }
  .inner { padding: 0 0 4px; border-top: 1px solid var(--line-soft); overflow-x: auto; }
  .inner table th { position: static; }
  td input.cell { width: 100%; min-width: 64px; padding: 4px 6px; border: 1px solid transparent; border-radius: 5px; background: transparent; }
  td input.cell:hover { border-color: var(--line); }
  td input.cell:focus { border-color: var(--accent); background: var(--panel); outline: none; }
  td input.cell.missing { border-color: var(--transit); background: var(--transit-bg); color: var(--transit-fg); }
  td input.cell.w-s { width: 70px; } td input.cell.w-m { width: 110px; }
  .saved { color: var(--delivered-fg); font-size: 12.5px; opacity: 0; transition: opacity .2s; }
  .saved.on { opacity: 1; }

  /* ---------- sync ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  .bar { height: 10px; border-radius: 5px; background: var(--line-soft); overflow: hidden; margin: 12px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .4s; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; margin-top: 22px; }
  .facts b { display: block; font-size: 24px; color: var(--ink); line-height: 1.2; }
  .facts span { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* ---------- notices, empty states, login ---------- */
  .notice { padding: 12px 14px; border-radius: 8px; background: var(--transit-bg); color: var(--transit-fg); margin-bottom: 16px; }
  .notice.error { background: var(--rto-bg); color: var(--rto-fg); }
  .empty { padding: 44px 18px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; }
  .empty h3 { color: var(--ink); margin-bottom: 6px; font-size: 17px; }
  .empty .btn { margin-top: 14px; }
  .loading { color: var(--muted); padding: 30px 0; }
  .login { max-width: 380px; margin: 14vh auto 0; padding: 0 16px; }
  .login h1 { font-size: 28px; margin-bottom: 6px; }
  .login p { color: var(--muted); margin-bottom: 22px; }
  .login form { display: flex; flex-direction: column; gap: 14px; }
  .login .error { color: var(--danger); font-size: 14px; min-height: 1.4em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<noscript>This app needs JavaScript switched on.</noscript>
<div id="app"></div>

<script>
'use strict';

/* ================= small helpers ================= */
const API_URL = '/.netlify/functions/api';
let password = '';
try { password = sessionStorage.getItem('inv-pw') || ''; } catch (e) { /* private window: stay logged out on reload */ }

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected' || k === 'open') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = (kid) => {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) return kid.forEach(add);
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  };
  kids.forEach(add);
  return el;
}
const svgEl = (tag, attrs, ...kids) => {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  kids.forEach((k) => k && el.append(k instanceof Node ? k : document.createTextNode(k)));
  return el;
};

const nf = new Intl.NumberFormat('en-IN');
const fmtInt = (n) => nf.format(Number(n) || 0);
const fmtMoney = (n) => (n == null ? '' : '₹' + nf.format(Math.round(Number(n))));
const pct = (a, b) => (b > 0 ? Math.round((a / b) * 1000) / 10 : 0);
const IST = 'Asia/Kolkata';
const thisYear = () => new Date().toLocaleDateString('en-CA', { timeZone: IST, year: 'numeric' });
function fmtDate(iso, withTime) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const opts = { timeZone: IST, day: 'numeric', month: 'short' };
  if (d.toLocaleDateString('en-CA', { timeZone: IST, year: 'numeric' }) !== thisYear()) opts.year = 'numeric';
  if (withTime) { opts.hour = 'numeric'; opts.minute = '2-digit'; }
  return d.toLocaleString('en-IN', opts);
}
const todayIST = () => new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10);
const addDays = (day, n) => new Date(Date.parse(day + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const istDay = (iso) => new Date(new Date(iso).getTime() + 330 * 60000).toISOString().slice(0, 10);
function ago(iso) {
  if (!iso) return 'never';
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 2) return 'just now';
  if (mins < 90) return mins + ' min ago';
  if (mins < 60 * 36) return Math.round(mins / 60) + ' hours ago';
  return Math.round(mins / 1440) + ' days ago';
}
const nice = (s) => {
  if (!s) return '';
  const t = String(s).replace(/[_-]+/g, ' ').trim().toLowerCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
};

const STAGES = [
  ['delivered', 'Delivered'],
  ['in_transit', 'On the way'],
  ['to_dispatch', 'To pack and ship'],
  ['returned', 'Returned by customer'],
  ['rto', 'Came back undelivered'],
  ['cancelled', 'Cancelled before shipping']
];
const stageLabel = (s) => (STAGES.find((x) => x[0] === s) || [s, nice(s)])[1];
const stageChip = (s) => h('span', { class: `chip stage-${s || 'other'}` }, stageLabel(s));
const RETURN_STATUS = { created: 'Open', completed: 'Completed', cancelled: 'Cancelled' };
const CONDITIONS = [['', 'Not marked'], ['sellable', 'Sellable'], ['damaged', 'Damaged'], ['dry_clean', 'Dry clean'], ['press', 'Press']];

async function api(action, body = {}) {
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-app-password': password },
      body: JSON.stringify({ action, ...body })
    });
  } catch (e) { throw new Error('Cannot reach the server. Check your internet connection and try again.'); }
  if (res.status === 401) { logout('That password is not right.'); throw new Error('Signed out'); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* ignore */ }
  if (!res.ok) throw new Error((data && data.error) || 'Something went wrong (' + res.status + ').');
  return data;
}

function downloadCsv(name, rows) {
  if (!rows.length) return;
  const cols = Object.keys(rows[0]);
  const q = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [cols.join(','), ...rows.map((r) => cols.map((c) => q(r[c])).join(','))].join('\n');
  const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })), download: name });
  document.body.append(a); a.click(); a.remove();
}

/** Like replaceChildren, but skips empty entries (null / false). */
function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); }
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ================= shell ================= */
const root = document.getElementById('app');
const VIEWS = [['overview', 'Overview'], ['orders', 'Orders'], ['returns', 'Returns'], ['catalogue', 'Catalogue'], ['sync', 'Sync']];
let freshBox = null;
let pollTimer = null;
let navToken = 0;

function logout(message) {
  password = '';
  try { sessionStorage.removeItem('inv-pw'); } catch (e) { /* ignore */ }
  showLogin(message);
}

function showLogin(message) {
  clearTimeout(pollTimer);
  const err = h('p', { class: 'error', role: 'alert' }, message || '');
  const input = h('input', { type: 'password', id: 'pw', autocomplete: 'current-password', required: true, 'aria-label': 'Password' });
  const btn = h('button', { class: 'btn', type: 'submit' }, 'Open app');
  const form = h('form', {
    onsubmit: async (e) => {
      e.preventDefault();
      password = input.value; btn.disabled = true; err.textContent = '';
      try {
        await api('ping');
        try { sessionStorage.setItem('inv-pw', password); } catch (x) { /* ignore */ }
        showApp();
      } catch (x) {
        if (x.message !== 'Signed out') err.textContent = x.message;
        btn.disabled = false;
      }
    }
  }, h('label', { class: 'field', for: 'pw' }, 'Password', input), err, btn);
  root.replaceChildren(h('div', { class: 'login' }, h('h1', null, 'Daswani Exports'), h('p', null, 'Inventory and returns. Enter your password to continue.'), form));
  input.focus();
}

function showApp() {
  freshBox = h('a', { href: '#sync', class: 'fresh' }, 'Checking…');
  const tabs = h('nav', { class: 'tabs', 'aria-label': 'Sections' }, VIEWS.map(([id, label]) => h('a', { href: '#' + id, 'data-view': id }, label)));
  const main = h('main', { id: 'main', tabindex: '-1' });
  root.replaceChildren(
    h('header', { class: 'top' }, h('div', { class: 'top-inner' },
      h('div', { class: 'brand' },

        h('div', { class: 'brand-right' }, freshBox, h('button', { class: 'linkbtn', onclick: () => logout('') }, 'Log out'))),
      tabs)),
    main);
  refreshFresh();

async function refreshFresh() {
  if (!freshBox || !freshBox.isConnected) return;
  try {
    const s = await api('sync_status');
    const mins = s.last_finished ? (Date.now() - new Date(s.last_finished).getTime()) / 60000 : Infinity;
    freshBox.className = 'fresh' + (s.running_now ? ' busy' : mins > 120 ? ' stale' : '');
    freshBox.textContent = s.running_now ? 'Updating now' : s.last_finished ? 'Updated ' + ago(s.last_finished) : 'No data downloaded yet';
  } catch (e) { /* leave as is */ }
  setTimeout(refreshFresh, 60000);
}

function route() {
  const id = (location.hash || '#overview').slice(1);
  const view = VIEWS.find((v) => v[0] === id) ? id : 'overview';
  document.querySelectorAll('nav.tabs a').forEach((a) => (a.getAttribute('data-view') === view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  clearTimeout(pollTimer);
  const main = document.getElementById('main');
  if (!main) return;
  const token = ++navToken;
  fill(main, h('p', { class: 'loading' }, 'Loading…'));
  document.title = (VIEWS.find((v) => v[0] === view) || [])[1] + ' · Daswani Exports';
  const fn = { overview: viewOverview, orders: viewOrders, returns: viewReturns, catalogue: viewCatalogue, sync: viewSync }[view];
  fn(main, () => token === navToken).catch((e) => {
    if (token !== navToken || e.message === 'Signed out') return;
    fill(main, h('div', { class: 'notice error', role: 'alert' }, 'Could not load this screen. ' + e.message + ' '),
      h('button', { class: 'btn', onclick: route }, 'Try again'));
  });
}

function selectField(label, options, state, key, onChange) {

function searchField(label, state, onChange) {

function pager(total, state, onChange) {

const ovState = { period: '30', from: null, to: null };

async function viewOverview(main, alive) {
  const periods = [['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['all', 'Everything available']];
  const today = todayIST();
  const range = ovState.period === 'all' ? { from: null, to: today } : { from: addDays(today, -(Number(ovState.period) - 1)), to: today };
  const data = await api('overview', range);
  if (!alive()) return;

  const sel = h('select', { 'aria-label': 'Period', onchange: () => { ovState.period = sel.value; route(); } },
    periods.map(([v, l]) => h('option', { value: v, selected: ovState.period === v }, l)));
  const head = h('div', { class: 'page-head' },
    h('div', null, h('h1', null, 'Overview')),
    h('label', { class: 'field' }, 'Period', sel));

  if (!data.coverage.orders_total) { fill(main, head, emptyData()); return; }

  const units = {};
  let placed = 0;
  for (const s of data.stages) { units[s.stage] = Number(s.units); placed += Number(s.units); }
  const u = (k) => units[k] || 0;
  const reached = u('delivered') + u('returned');
  const parts = [];
  if (u('delivered')) parts.push(h('span', null, h('strong', null, fmtInt(u('delivered'))), ' delivered and kept'));
  if (u('returned')) parts.push(h('span', null, h('strong', null, fmtInt(u('returned'))), ' returned by customers'));
  if (u('rto')) parts.push(h('span', null, h('strong', null, fmtInt(u('rto'))), ' came back undelivered'));
  if (u('cancelled')) parts.push(h('span', null, h('strong', null, fmtInt(u('cancelled'))), ' cancelled before shipping'));
  if (u('in_transit')) parts.push(h('span', null, h('strong', null, fmtInt(u('in_transit'))), ' on the way'));
  if (u('to_dispatch')) parts.push(h('span', null, h('strong', null, fmtInt(u('to_dispatch'))), ' waiting to be packed'));
  const joined = [];
  parts.forEach((p, i) => { joined.push(p); if (i < parts.length - 2) joined.push(', '); else if (i === parts.length - 2) joined.push(' and '); });
  const lede = h('p', { class: 'lede' },
    placed ? [h('strong', null, fmtInt(placed)), placed === 1 ? ' item was ordered' : ' items were ordered', ' in this period. ', parts.length ? ['Of these, ', joined, '.'] : '',
      reached ? [' Of the items that reached customers, ', h('strong', null, pct(u('returned'), reached) + '%'), ' came back.'] : '']
      : 'Nothing was ordered in this period.');

  const bar = h('div', { class: 'journey', role: 'img', 'aria-label': 'Where this period’s orders ended up' },
    STAGES.filter(([k]) => u(k) > 0).map(([k, label]) =>
      h('span', { class: `stage-${k}`, style: `flex: ${u(k)} 1 0`, title: `${label}: ${fmtInt(u(k))}` })));
  const legend = h('ul', { class: 'legend' }, STAGES.filter(([k]) => u(k) > 0).map(([k, label]) =>
    h('li', { class: `stage-${k}` }, h('i', { class: 'swatch' }), label, ' ', h('strong', null, fmtInt(u(k))), h('span', { class: 'muted' }, ` ${pct(u(k), placed)}%`))));

  // returns raised in the period (by the date the return was raised)
  let custReturns = 0, courierReturns = 0;
  for (const r of data.returns) {
    if (r.status === 'cancelled') continue;
    if (r.type === 'customer_return') custReturns += Number(r.n); else courierReturns += Number(r.n);
  }
  const raised = h('p', { class: 'sub' }, `Return requests raised in this period: ${fmtInt(custReturns)} from customers and ${fmtInt(courierReturns)} sent back by the courier. These are counted by the date the return was raised, so they include returns of older orders.`);

  const first = ovState.period === 'all' ? istDay(data.coverage.first_order) : range.from;
  const chart = dailyChart(data.daily, data.dailyReturns, first, range.to);

  const byReason = new Map();
  for (const r of data.reasons) {
    const key = r.reason || '';
    const g = byReason.get(key) || { reason: key, n: 0, subs: [] };
    g.n += Number(r.n); g.subs.push({ sub: r.sub_reason, n: Number(r.n) });
    byReason.set(key, g);
  }
  const groups = [...byReason.values()].sort((a, b) => b.n - a.n).slice(0, 8);
  const maxReason = Math.max(1, ...groups.map((g) => g.n));
  const reasons = groups.length
    ? h('ol', { class: 'reasons' }, groups.map((g) => h('li', null,
        h('div', null, h('div', { class: 'what' }, nice(g.reason) || 'No reason given'),
          g.subs.some((x) => x.sub) ? h('div', { class: 'sub' }, g.subs.filter((x) => x.sub).sort((a, b) => b.n - a.n).slice(0, 3).map((x) => `${nice(x.sub)} ${x.n}`).join(', ')) : null),
        h('div', { class: 'count' }, fmtInt(g.n)),
        h('div', { class: 'track' }, h('i', { style: `width:${(g.n / maxReason) * 100}%` })))))
    : h('p', { class: 'muted' }, 'No customer returns in this period.');

  const top = data.top.slice(0, 12);
  const sellers = h('div', { class: 'tablewrap' }, h('table', { class: 'items stack' },
    h('thead', null, h('tr', null, h('th', null, 'Item'), h('th', { class: 'num' }, 'Ordered'), h('th', { class: 'num' }, 'Delivered'), h('th', { class: 'num' }, 'Returned'), h('th', { class: 'num' }, 'Return rate'))),
    h('tbody', null, top.map((t) => {
      const rr = pct(Number(t.returned || 0), Number(t.delivered || 0) + Number(t.returned || 0));
      return h('tr', null, h('td', null, t.name || 'Unknown item'), h('td', { class: 'num', 'data-l': 'Ordered' }, fmtInt(t.units)), h('td', { class: 'num', 'data-l': 'Delivered' }, fmtInt(t.delivered)),
        h('td', { class: 'num', 'data-l': 'Returned' }, fmtInt(t.returned)), h('td', { class: 'num', 'data-l': 'Return rate' }, Number(t.delivered || 0) + Number(t.returned || 0) ? rr + '%' : ''));
    }))));

  const cov = data.coverage;
  fill(main, 
    head, lede, bar, legend,
    h('section', { class: 'block' }, h('h2', null, 'Orders and returns by day'), raised, chart),
    h('div', { class: 'two block' },
      h('section', null, h('h2', null, 'Why customers return'), h('p', { class: 'sub' }, 'Customer returns raised in this period.'), reasons),
      h('section', null, h('h2', null, 'Best sellers'), h('p', { class: 'sub' }, 'Return rate is returned items out of those that reached the customer.'), sellers)),
    h('p', { class: 'muted block', style: 'font-size:13px' },
      `Data held: ${fmtInt(cov.orders_total)} order items and ${fmtInt(cov.returns_total)} returns, from ${fmtDate(cov.first_order)} to ${fmtDate(cov.last_order)}. Flipkart only provides about the last 3 months.`));
}

function dailyChart(daily, dailyReturns, from, to) {
  const oMap = new Map(daily.map((d) => [d.d, Number(d.units) || 0]));
  const rMap = new Map(dailyReturns.map((d) => [d.d, Number(d.n) || 0]));
  const days = [];
  for (let d = from; d <= to && days.length < 800; d = addDays(d, 1)) days.push(d);
  if (!days.length) return h('p', { class: 'muted' }, 'No days to show.');
  const max = Math.max(1, ...days.map((d) => Math.max(oMap.get(d) || 0, rMap.get(d) || 0)));
  const top = Math.ceil(max / 4 / (max > 40 ? 10 : 5)) * (max > 40 ? 10 : 5) * 4 || 4;
  const W = 1000, H = 230, L = 38, B = 26, T = 8, R = 6;
  const step = (W - L - R) / days.length;
  const gw = Math.min(step * 0.8, 34);
  const bw = Math.max(1.5, gw / 2 - 0.5);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const svg = svgEl('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Orders placed and returns raised per day, ${fmtDate(days[0] + 'T12:00:00+05:30')} to ${fmtDate(days[days.length - 1] + 'T12:00:00+05:30')}` });
  for (let i = 0; i <= 4; i++) {
    const v = (top / 4) * i;
    svg.append(svgEl('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }), svgEl('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }, fmtInt(v)));
  }
  const every = Math.max(1, Math.ceil(days.length / 9));
  days.forEach((d, i) => {
    const cx = L + step * i + step / 2;
    const o = oMap.get(d) || 0, r = rMap.get(d) || 0;
    if (o) svg.append(svgEl('rect', { class: 'bar-orders', x: cx - bw - 0.5, width: bw, y: y(o), height: y(0) - y(o), rx: 1 }));
    if (r) svg.append(svgEl('rect', { class: 'bar-returns', x: cx + 0.5, width: bw, y: y(r), height: y(0) - y(r), rx: 1 }));
    svg.append(svgEl('rect', { class: 'hit', x: L + step * i, width: step, y: T, height: H - T - B }, svgEl('title', {}, `${fmtDate(d + 'T12:00:00+05:30')}: ${o} orders, ${r} returns`)));
    if (i % every === 0) svg.append(svgEl('text', { x: cx, y: H - 7, 'text-anchor': 'middle' }, fmtDate(d + 'T12:00:00+05:30')));
  });
  return h('div', null,
    h('div', { class: 'chart-legend' },
      h('span', null, h('i', { class: 'swatch', style: 'background:var(--ink)' }), 'Orders placed'),
      h('span', null, h('i', { class: 'swatch', style: 'background:var(--returned)' }), 'Returns raised')),
    h('div', { class: 'chart-scroll' }, svg));
}

/* ================= Catalogue ================= */
const catState = { onlyNoCost: false, onlyReview: false, q: '' };

async function viewCatalogue(main, alive) {
  const { items } = await api('catalogue');
  if (!alive()) return;
  const body = h('div');

  function draw() {
    const q = catState.q.toLowerCase();
    const shown = items.filter((i) =>
      (!catState.onlyNoCost || i.unit_cost == null) && (!catState.onlyReview || i.needs_review) &&
      (!q || `${i.name} ${i.sku_texts || ''}`.toLowerCase().includes(q)));
    const groups = new Map();
    shown.forEach((i) => { const k = i.design || 'No design set'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
    if (!shown.length) { body.replaceChildren(h('div', { class: 'empty' }, h('h3', null, 'No items match'), h('p', null, 'Clear the filters to see everything.'))); return; }
    body.replaceChildren(...[...groups.entries()].map(([design, list]) => designBlock(design, list, items)));
  }

  function designBlock(design, list) {
    const missing = list.filter((i) => i.unit_cost == null).length;
    const sold = list.reduce((a, i) => a + Number(i.units_90d || 0), 0);
    const bulk = h('input', { type: 'number', min: '0', step: '1', placeholder: 'Cost ₹', 'aria-label': `Cost for all ${design}`, class: 'cell', style: 'width:84px' });
    const apply = h('button', { class: 'btn small quiet', onclick: async (e) => {
      e.preventDefault();
      if (bulk.value === '') return;
      apply.disabled = true;
      try { await api('design_cost', { design, unit_cost: bulk.value }); list.forEach((i) => (i.unit_cost = bulk.value)); items.forEach((i) => { if ((i.design || 'No design set') === design) i.unit_cost = bulk.value; }); draw(); }
      catch (err) { alert(err.message); apply.disabled = false; }
    } }, `Set for all ${list.length}`);
    const checkAll = h('button', { class: 'btn small quiet', title: 'Tick “Checked” on every row of this design', onclick: async (e) => {
      e.preventDefault();
      checkAll.disabled = true;
      try { await api('design_checked', { design, checked: true }); items.forEach((i) => { if ((i.design || 'No design set') === design) i.needs_review = false; }); draw(); }
      catch (err) { alert(err.message); checkAll.disabled = false; }
    } }, 'Mark all checked');
    const det = h('details', { class: 'design', open: Boolean(catState.q || catState.onlyNoCost || catState.onlyReview) },
      h('summary', null,
        h('span', { class: 'design-name' }, design),
        h('span', { class: 'design-facts' }, `${list.length} sizes and colours, ${fmtInt(sold)} sold in 90 days`, missing ? `, ${missing} without a cost` : ''),
        h('span', { class: 'design-bulk', onclick: (e) => e.stopPropagation() }, bulk, apply, checkAll)),
      h('div', { class: 'inner' }, h('table', { class: 'stack' },
        h('thead', null, h('tr', null, h('th', null, 'Colour'), h('th', null, 'Size'), h('th', null, 'Flipkart SKU'), h('th', { class: 'num' }, 'Cost ₹'), h('th', { class: 'num' }, 'Lead time (days)'),
          h('th', { class: 'num' }, 'Sold 30 days'), h('th', { class: 'num' }, 'Sold 90 days'), h('th', { class: 'num' }, 'Returned 90 days'), h('th', null, 'Details checked'), h('th', null, ''))),
        h('tbody', null, list.map(itemRow)))));
    return det;
  }

  function itemRow(i) {
    const saved = h('span', { class: 'saved', 'aria-live': 'polite' }, 'Saved');
    const field = (key, cls, type = 'text') => {
      const inp = h('input', { class: `cell ${cls || ''}${key === 'unit_cost' && i[key] == null ? ' missing' : ''}`, type, value: i[key] == null ? '' : i[key],
        'aria-label': `${key.replace('_', ' ')} for ${i.name}`, ...(type === 'number' ? { min: '0', step: '1' } : {}),
        onchange: async () => {
          try {
            const res = await api('save_item', { id: i.id, fields: { [key]: inp.value } });
            Object.assign(i, res.item);
            inp.classList.toggle('missing', key === 'unit_cost' && (inp.value === ''));
            saved.classList.add('on'); setTimeout(() => saved.classList.remove('on'), 1500);
          } catch (e) { alert(e.message); inp.value = i[key] == null ? '' : i[key]; }
        } });
      return inp;
    };
    const checked = h('input', { type: 'checkbox', checked: !i.needs_review, 'aria-label': `Details checked for ${i.name}`,
      onchange: async () => {
        try { await api('save_item', { id: i.id, fields: { needs_review: !checked.checked } }); i.needs_review = !checked.checked; saved.classList.add('on'); setTimeout(() => saved.classList.remove('on'), 1500); }
        catch (e) { alert(e.message); checked.checked = !i.needs_review; }
      } });
    return h('tr', null,
      h('td', { 'data-l': 'Colour' }, field('colour', 'w-m')), h('td', { 'data-l': 'Size' }, field('size', 'w-s')),
      h('td', { class: 'muted', 'data-l': 'Flipkart SKU' }, i.sku_texts || ''),
      h('td', { class: 'num', 'data-l': 'Cost ₹' }, field('unit_cost', 'w-s', 'number')),
      h('td', { class: 'num', 'data-l': 'Lead time (days)' }, field('lead_time_days', 'w-s', 'number')),
      h('td', { class: 'num', 'data-l': 'Sold 30 days' }, fmtInt(i.units_30d)), h('td', { class: 'num', 'data-l': 'Sold 90 days' }, fmtInt(i.units_90d)), h('td', { class: 'num', 'data-l': 'Returned 90 days' }, fmtInt(i.returned_90d)),
      h('td', { 'data-l': 'Details checked' }, checked), h('td', { 'data-l': '' }, saved));
  }

  const noCost = items.filter((i) => i.unit_cost == null).length;
  const toReview = items.filter((i) => i.needs_review).length;
  const search = h('input', { type: 'search', value: catState.q, placeholder: 'Item or SKU', 'aria-label': 'Search catalogue', oninput: debounce(() => { catState.q = search.value.trim(); draw(); }, 250) });
  const c1 = h('input', { type: 'checkbox', checked: catState.onlyNoCost, onchange: () => { catState.onlyNoCost = c1.checked; draw(); } });
  const c2 = h('input', { type: 'checkbox', checked: catState.onlyReview, onchange: () => { catState.onlyReview = c2.checked; draw(); } });
  fill(main, 
    h('div', { class: 'page-head' }, h('div', null, h('h1', null, 'Catalogue'),
      h('p', null, 'Everything you sell. New Flipkart listings appear here by themselves, with a guess for design, colour and size. Fix anything that looks wrong, and fill in the cost per piece and the lead time. The reorder maths in the next step depends on these.'))),
    noCost ? h('div', { class: 'notice' }, `${noCost} of ${items.length} items still have no cost. You can set one cost for a whole design with the box on its heading.`) : null,
    h('div', { class: 'controls' },
      h('label', { class: 'field' }, 'Search', search),
      h('label', { class: 'field' }, 'Only show', h('span', null, c1, ` items with no cost (${noCost})`)),
      h('label', { class: 'field' }, ' ', h('span', null, c2, ` items not checked yet (${toReview})`))),
    body);
  draw();
}

/* ================= Sync ================= */
const MODE_LABEL = { history: 'Full download', update: 'Update, last 3 weeks', light: 'Quick update' };

async function viewSync(main, alive) {
  const s = await api('sync_status');
  if (!alive()) return;
  const latest = s.batches[0];
  const open = latest ? Number(latest.open) : 0;
  const busy = s.running_now || open > 0;

  const start = (mode) => async (e) => {
    e.target.disabled = true;
    try { await api('start_sync', { mode }); } catch (err) { alert(err.message); }
    route();
  };

  let progress = null;
  if (latest && !latest.finished_at && Number(latest.tasks)) {
    const donePct = Math.round(((Number(latest.done) + Number(latest.failed)) / Number(latest.tasks)) * 100);
    progress = h('div', { class: 'panel', style: 'margin-bottom:18px' },
      h('h2', null, MODE_LABEL[latest.mode] || 'Download', ' in progress'),
      h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': donePct }, h('i', { style: `width:${donePct}%` })),
      h('p', { class: 'muted' }, `${fmtInt(latest.done)} of ${fmtInt(latest.tasks)} steps done, ${fmtInt(latest.rows)} records saved. ${s.running_now ? 'Working now.' : 'Waiting for the next turn; it carries on by itself within 30 minutes, or press Continue.'}`),
      s.running_now ? null : h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: start('update') }, 'Continue now')));
  }

  const rows = s.batches.map((b) => h('tr', null,
    h('td', null, fmtDate(b.created_at, true)), h('td', null, MODE_LABEL[b.mode] || b.mode),
    h('td', null, b.finished_at ? fmtDate(b.finished_at, true) : 'Running'),
    h('td', { class: 'num' }, `${fmtInt(b.done)} of ${fmtInt(b.tasks)}`), h('td', { class: 'num' }, fmtInt(b.failed) === '0' ? '' : fmtInt(b.failed)), h('td', { class: 'num' }, fmtInt(b.rows))));

  fill(main, 
    h('div', { class: 'page-head' }, h('div', null, h('h1', null, 'Sync'),
      h('p', null, 'The app asks Flipkart for new orders and returns every 30 minutes by itself. Use these buttons only when you want an update right now or the first full download.'))),
    progress,
    h('div', { class: 'panel' },
      h('h2', null, 'Download from Flipkart'),
      h('p', { class: 'muted', style: 'margin-top:4px' }, 'Flipkart keeps about 3 months of order history available. The full download collects all of it and can take several minutes. It is safe to press again at any time; nothing gets duplicated.'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', disabled: busy, onclick: start('history') }, 'Download full history'),
        h('button', { class: 'btn quiet', disabled: busy, onclick: start('update') }, 'Update now')),
      h('div', { class: 'facts' },
        h('div', null, h('b', null, fmtInt(s.orders_total)), h('span', null, 'order items saved')),
        h('div', null, h('b', null, fmtInt(s.returns_total)), h('span', null, 'returns saved')),
        h('div', null, h('b', null, fmtInt(s.listings_total)), h('span', null, 'Flipkart listings known')),
        h('div', null, h('b', null, s.last_finished ? ago(s.last_finished) : 'never'), h('span', null, 'last finished download')))),
    s.errors.length ? h('section', { class: 'block' }, h('h2', null, 'Problems'),
      h('p', { class: 'sub' }, 'A step that fails is tried up to three times. Anything still listed here has not been downloaded yet; the next update tries again.'),
      h('div', { class: 'tablewrap' }, h('table', null, h('tbody', null, s.errors.map((e) => h('tr', null, h('td', null, `${nice(e.kind)} ${e.source}`), h('td', null, e.last_error), h('td', null, fmtDate(e.updated_at, true)))))))) : null,
    rows.length ? h('section', { class: 'block' }, h('h2', null, 'Recent downloads'),
      h('div', { class: 'tablewrap', style: 'margin-top:12px' }, h('table', null,
        h('thead', null, h('tr', null, h('th', null, 'Started'), h('th', null, 'Kind'), h('th', null, 'Finished'), h('th', { class: 'num' }, 'Steps done'), h('th', { class: 'num' }, 'Failed'), h('th', { class: 'num' }, 'Records'))),
        h('tbody', null, rows)))) : null);

  if (busy) pollTimer = setTimeout(() => { if (alive()) route(); }, 5000);
}

/* ================= start ================= */
if (password) showApp(); else showLogin('');
